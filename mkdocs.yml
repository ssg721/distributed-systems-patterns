site_name: Distributed Systems Patterns
site_url: https://ssg721.github.io/distributed-systems-patterns/
site_description: The patterns that make distributed systems work, and how real systems use them.
repo_url: https://github.com/ssg721/distributed-systems-patterns
repo_name: ssg721/distributed-systems-patterns
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Coordination and Consistency:
      - 01-coordination-and-consistency/README.md
      - "Consensus: Raft and Paxos":
          - Overview: 01-coordination-and-consistency/01-consensus/README.md
          - In real systems: 01-coordination-and-consistency/01-consensus/real-world-systems.md
          - Design exercises: 01-coordination-and-consistency/01-consensus/exercises.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
